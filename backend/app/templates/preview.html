<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snip. — redirecting</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      color: #e8e8ec;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      max-width: 480px;
      width: 90%;
      padding: 32px;
      background: #16161d;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      text-align: center;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b8b96;
      margin-bottom: 8px;
    }
    .destination {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 14px;
      word-break: break-all;
      background: #1e1e27;
      border: 1px solid #2a2a35;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .continue { background: #6c63ff; color: #fff; border: none; }
    .cancel { background: #1e1e27; color: #8b8b96; border: 1px solid #2a2a35; }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">This link goes to</p>
    <p class="destination">{{ original_url }}</p>
    <div class="actions">
      <a href="/go/{{ alias }}" class="btn continue">Continue</a>
      <a href="{{ frontend_origin }}" class="btn cancel">Cancel</a>
    </div>
  </div>
</body>
</html>
